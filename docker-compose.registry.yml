services:
  stremio-rss-catalog:
    image: ${REGISTRY_IMAGE:-ghcr.io/nexis-cmyk/stremio-rss-catalog}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: stremio-rss-catalog
    restart: unless-stopped
    ports:
      - "7973:7000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      PORT: 7000
      NODE_ENV: production
      TZ: Europe/Berlin
      DB_PATH: /data/addon.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: stremio-rss-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 300 --cleanup
